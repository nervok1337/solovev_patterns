openapi: 3.0.0
info:
  title: Main API
  version: "1.0"
  description: API "ООО <Ромашка>"

servers:
  - url: http://localhost:8000
    description: Local development server

paths:
  /api/get_default_report:
    get:
      summary: Получить отчет по сущности
      description: Генерирует отчет для конкретного объекта по его уникальному коду.
      operationId: main.get_default_report
      parameters:
        - name: type
          in: query
          required: true
          schema:
            type: string
            example: ranges
          description: Ключ коллекции из ответа /api/get_entities. Например, ranges, groups или warehouses.
        - name: code
          in: query
          required: true
          schema:
            type: string
          description: Уникальный код объекта.
      responses:
        '200':
          description: Успешно сгенерированный отчет.
          content:
            text/plain: 
              schema:
                type: string
            text/html:
              schema:
                type: string
            application/xml:
              schema:
                type: string
            text/csv:
              schema:
                type: string
            text/markdown:
              schema:
                type: string
        '400':
          description: Ошибка в параметрах запроса.
          content:
            application/json:
              schema:
                type: object
              example:
                error: "Необходимо указать type и code"
        '404':
          description: Сущность с указанным кодом не найдена.
          content:
            application/json:
              schema:
                type: object
              example:
                error: "Сущность с кодом example не найдена"
        '500':
          description: Внутренняя ошибка сервера.
          content:
            text/plain:
              schema:
                type: string
              example: "Ошибка: Невозможно получить требуемый отчет!"

  /api/get_entities:
    get:
      summary: Получить список доменных сущностей
      description: Возвращает ключи всех публичных коллекций моделей хранилища для параметра type в запросах отчётов.
      operationId: main.get_entities
      responses:
        '200':
          description: Список ключей сущностей в формате JSON.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              example: ["groups", "nomenclatures", "ranges", "recipes", "warehouses"]
        '500':
          description: Внутренняя ошибка сервера.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: "Ошибка: Невозможно получить список доменных сущностей!"

  /api/report-formats:
    get:
      operationId: main.get_report_formats
      summary: Получить все зарегистрированные форматы отчётов
      responses:
        '200':
          description: Список форматов
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /api/entities/{entity_type}:
    parameters:
    - $ref: '#/components/parameters/EntityType'
    get:
      operationId: main.list_entities
      summary: Получить список сущностей
      responses:
        '200':
          description: Список сущностей
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Entity'
        '400':
          $ref: '#/components/responses/Invalid'
    post:
      operationId: main.create_entity
      summary: Создать сущность
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityInput'
      responses:
        '201':
          description: Созданная сущность
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entity'
        '400':
          $ref: '#/components/responses/Invalid'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/entities/{entity_type}/{code}:
    parameters:
    - $ref: '#/components/parameters/EntityType'
    - $ref: '#/components/parameters/Code'
    get:
      operationId: main.get_entity
      summary: Получить сущность по коду
      responses:
        '200':
          description: Найденная сущность
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entity'
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/Missing'
    put:
      operationId: main.replace_entity
      summary: Заменить данные сущности
      description: Все обязательные параметры конструктора передаются заново. Пропущенный
        код сохраняется. Изменение кода используемой сущности запрещено.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityInput'
      responses:
        '200':
          description: Обновлённая сущность
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entity'
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/Missing'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: main.delete_entity
      summary: Удалить неиспользуемую сущность
      responses:
        '204':
          description: Сущность удалена
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/Missing'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/get_report:
    get:
      summary: Получить отчёт в указанном формате
      description: Генерирует отчет для конкретного объекта по его уникальному коду.
      operationId: main.get_report
      parameters:
      - name: type
        in: query
        required: true
        schema:
          type: string
          example: ranges
        description: Ключ коллекции из ответа /api/get_entities. Например, ranges,
          groups или warehouses.
      - name: code
        in: query
        required: true
        schema:
          type: string
        description: Уникальный код объекта.
      - name: format
        in: query
        required: true
        schema:
          type: string
          minLength: 1
        description: Формат из GET /api/report-formats
      responses:
        '200':
          description: Успешно сгенерированный отчет.
          content:
            text/plain:
              schema:
                type: string
            text/html:
              schema:
                type: string
            application/xml:
              schema:
                type: string
            text/csv:
              schema:
                type: string
            text/markdown:
              schema:
                type: string
        '400':
          description: Ошибка в параметрах запроса.
          content:
            application/json:
              schema:
                type: object
              example:
                error: Необходимо указать type и code
        '404':
          description: Сущность с указанным кодом не найдена.
          content:
            application/json:
              schema:
                type: object
              example:
                error: Сущность с кодом example не найдена
        '500':
          description: Внутренняя ошибка сервера.
          content:
            text/plain:
              schema:
                type: string
              example: 'Ошибка: Невозможно получить требуемый отчет!'

components:
  schemas:
    Entity:
      type: object
    EntityInput:
      type: object
      description: Поля конструктора и свойства с сеттерами. Связи передаются как
        {"ref":"код существующей сущности"}.
    Error:
      type: object
      properties:
        error:
          type: string
  parameters:
    EntityType:
      name: entity_type
      in: path
      required: true
      schema:
        type: string
      description: Коллекция из GET /api/get_entities
    Code:
      name: code
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  responses:
    Invalid:
      description: Неверные поля, значения или ссылки
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Missing:
      description: Сущность не найдена
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Код занят либо сущность используется другим объектом
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
