openapi: 3.0.0
info:
  title: Main API
  version: "1.0"
  description: API "ООО <Ромашка>"

servers:
  - url: http://localhost:8000
    description: Local development server

paths:
  /api/storage/snapshot:
    get:
      operationId: main.get_storage_snapshot
      summary: Выгрузить все актуальные коллекции одним JSON
      description: Включает транзакции и полные вложенные сущности с их уникальными кодами.
      responses:
        '200':
          description: Полный снимок текущего состояния CRUD
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageSnapshot'
    post:
      operationId: main.restore_storage_snapshot
      summary: Целиком восстановить коллекции из снимка
      description: >-
        Требует все зарегистрированные коллекции, включая пустые.
        Вложенные сущности передаются целиком, как при выгрузке.
        Неверный снимок отклоняется без изменения текущих данных.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorageSnapshot'
      responses:
        '204':
          description: Состояние полностью восстановлено
        '400':
          $ref: '#/components/responses/Invalid'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/entities/{entity_type}/filter:
    parameters:
      - $ref: '#/components/parameters/EntityType'
    post:
      operationId: main.filter_entities
      summary: Отобрать сущности общим прототипом
      description: >-
        Условия объединяются через И. EQUALS — точное равенство,
        LIKE — вхождение подстроки; обе операции учитывают регистр.
        Путь к name или unique_code может проходить через свойства и коллекции,
        например ingredients.nomenclature.name. В коллекции достаточно одного
        совпадения. Пустой список условий возвращает всю коллекцию.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilterRequest'
      responses:
        '200':
          description: Выбранные сущности с прежними уникальными кодами
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Entity'
        '400':
          $ref: '#/components/responses/Invalid'

  /api/turnover:
    post:
      operationId: main.get_turnover
      summary: Получить количественную оборотно-сальдовую ведомость
      description: >-
        Использует транзакции из CRUD и тот же механизм фильтрации.
        Границы периода включены, используются календарные даты period
        в сохранённом часовом поясе транзакции. Фильтры применяются ко всем
        движениям, включая начальный остаток. Разные склады, товары и единицы
        измерения выводятся отдельными строками без пересчёта единиц.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TurnoverRequest'
      responses:
        '200':
          description: Начальный остаток, приход, расход и конечный остаток
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TurnoverRow'
        '400':
          $ref: '#/components/responses/Invalid'

  /api/report-formats:
    get:
      operationId: main.get_report_formats
      summary: Получить форматы отчётов
      responses:
        '200':
          description: Все допустимые форматы
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /api/entities/{entity_type}:
    parameters:
      - $ref: '#/components/parameters/EntityType'
    get:
      operationId: main.list_entities
      summary: Получить коллекцию сущностей
      responses:
        '200':
          description: Коллекция
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Entity'
        '400':
          $ref: '#/components/responses/Invalid'
    post:
      operationId: main.create_entity
      summary: Создать сущность
      requestBody:
        $ref: '#/components/requestBodies/Entity'
      responses:
        '201':
          $ref: '#/components/responses/Entity'
        '400':
          $ref: '#/components/responses/Invalid'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/entities/{entity_type}/{code}:
    parameters:
      - $ref: '#/components/parameters/EntityType'
      - $ref: '#/components/parameters/Code'
    get:
      operationId: main.get_entity
      summary: Получить сущность по коду
      responses:
        '200':
          $ref: '#/components/responses/Entity'
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/Missing'
    put:
      operationId: main.replace_entity
      summary: Заменить данные сущности
      description: >-
        Обязательные параметры конструктора передаются заново. Пропущенный код
        сохраняется. Связанные объекты передаются как {ref: код}.
        Изменять код используемой сущности запрещено.
      requestBody:
        $ref: '#/components/requestBodies/Entity'
      responses:
        '200':
          $ref: '#/components/responses/Entity'
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/Missing'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: main.delete_entity
      summary: Удалить неиспользуемую сущность
      responses:
        '204':
          description: Сущность удалена
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/Missing'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/get_report:
    get:
      operationId: main.get_report
      summary: Получить отчёт в выбранном формате
      parameters:
        - name: format
          in: query
          required: true
          schema:
            type: string
        - name: type
          in: query
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Отчёт
          content:
            text/plain:
              schema:
                type: string
            text/html:
              schema:
                type: string
            application/xml:
              schema:
                type: string
            text/csv:
              schema:
                type: string
            text/markdown:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/Missing'

  /api/get_default_report:
    get:
      summary: Получить отчет по сущности
      description: Генерирует отчет для конкретного объекта по его уникальному коду.
      operationId: main.get_default_report
      parameters:
        - name: type
          in: query
          required: true
          schema:
            type: string
            example: ranges
          description: Ключ коллекции из ответа /api/get_entities. Например, ranges, groups или warehouses.
        - name: code
          in: query
          required: true
          schema:
            type: string
          description: Уникальный код объекта.
      responses:
        '200':
          description: Успешно сгенерированный отчет.
          content:
            text/plain: 
              schema:
                type: string
            text/html:
              schema:
                type: string
            application/xml:
              schema:
                type: string
            text/csv:
              schema:
                type: string
            text/markdown:
              schema:
                type: string
        '400':
          description: Ошибка в параметрах запроса.
          content:
            application/json:
              schema:
                type: object
              example:
                error: "Необходимо указать type и code"
        '404':
          description: Сущность с указанным кодом не найдена.
          content:
            application/json:
              schema:
                type: object
              example:
                error: "Сущность с кодом example не найдена"
        '500':
          description: Внутренняя ошибка сервера.
          content:
            text/plain:
              schema:
                type: string
              example: "Ошибка: Невозможно получить требуемый отчет!"

  /api/get_entities:
    get:
      summary: Получить список доменных сущностей
      description: Возвращает ключи всех публичных коллекций моделей хранилища для параметра type в запросах отчётов.
      operationId: main.get_entities
      responses:
        '200':
          description: Список ключей сущностей в формате JSON.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              example: ["groups", "nomenclatures", "ranges", "recipes", "warehouses"]
        '500':
          description: Внутренняя ошибка сервера.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: "Ошибка: Невозможно получить список доменных сущностей!"

components:
  schemas:
    StorageSnapshot:
      type: object
      additionalProperties:
        type: array
        items:
          $ref: '#/components/schemas/Entity'
    FilterCondition:
      type: object
      additionalProperties: false
      required: [field, value]
      properties:
        field:
          type: string
          minLength: 1
          description: Публичный путь, завершающийся name или unique_code
          example: group.name
        value:
          type: string
          example: Продукты
        comparison:
          type: string
          enum: [EQUALS, LIKE]
          default: EQUALS
    FilterConditions:
      type: array
      default: []
      items:
        $ref: '#/components/schemas/FilterCondition'
    FilterRequest:
      type: object
      additionalProperties: false
      properties:
        filters:
          $ref: '#/components/schemas/FilterConditions'
    TurnoverRequest:
      type: object
      additionalProperties: false
      required: [start, end]
      properties:
        start:
          type: string
          format: date
          example: '2026-11-01'
        end:
          type: string
          format: date
          example: '2026-11-30'
        filters:
          $ref: '#/components/schemas/FilterConditions'
    EntityReference:
      type: object
      required: [ref]
      additionalProperties: false
      properties:
        ref:
          type: string
    TurnoverRow:
      type: object
      additionalProperties: false
      required: [storage, nomenclature, range, opening_balance, income, expense, closing_balance]
      properties:
        storage:
          $ref: '#/components/schemas/EntityReference'
        nomenclature:
          $ref: '#/components/schemas/EntityReference'
        range:
          $ref: '#/components/schemas/EntityReference'
        opening_balance:
          type: number
        income:
          type: number
        expense:
          type: number
        closing_balance:
          type: number
    Entity:
      type: object
      required: [unique_code]
      properties:
        unique_code:
          type: string
      additionalProperties: true
    EntityInput:
      type: object
      additionalProperties: true
      description: >-
        Поля конструктора и изменяемые свойства модели. Ссылки на существующие
        сущности передаются объектами {ref: код}; вложенное создание запрещено.
  parameters:
    EntityType:
      name: entity_type
      in: path
      required: true
      schema:
        type: string
      description: Коллекция из GET /api/get_entities.
    Code:
      name: code
      in: path
      required: true
      schema:
        type: string
  requestBodies:
    Entity:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EntityInput'
  responses:
    Entity:
      description: Доменная сущность
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Entity'
    Invalid:
      description: Некорректные данные
      content:
        application/json:
          schema:
            type: object
    Missing:
      description: Сущность не найдена
      content:
        application/json:
          schema:
            type: object
    Conflict:
      description: Код занят или сущность используется другим объектом
      content:
        application/json:
          schema:
            type: object
